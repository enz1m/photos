<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Photos</title>
  <defs>
    <filter id="enz-photos-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="enz-photos-pic">
      <rect x="25" y="35" width="78" height="58" rx="4"/>
    </clipPath>
  </defs>

  <!-- landscape keyline; frame 92 x 72 (18..110 x 28..100), picture inset 7; sheet turned -7 deg;
       peaks r 4 with 45 deg flanks: back apex (50 58), front apex (80 68) -->
  <g filter="url(#enz-photos-drop)">
    <rect x="18" y="28" width="92" height="72" rx="9" fill="#F2648F" transform="rotate(-7 64 64)"/>
    <rect x="18" y="28" width="92" height="72" rx="9" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#enz-photos-pic)">
    <rect x="25" y="35" width="78" height="58" fill="#FFE4D6"/>
    <circle cx="86" cy="50" r="8" fill="#FFB938"/>
    <path d="M47.17 60.83 A4 4 0 0 1 52.83 60.83 L90 98 H10 Z" fill="#F57BA6"/>
    <path d="M77.17 70.83 A4 4 0 0 1 82.83 70.83 L112 100 H48 Z" fill="#8A4FDC"/>
  </g>
</svg>
